# Render Blueprint: one free web service hosts both the React site and the API.
# Database: Neon (free PostgreSQL).
#
# Files: stored on the service's own disk. On the free plan that disk is wiped
# on every restart and redeploy, so uploaded property images and documents do
# not survive. Switch STORAGE_DRIVER to `s3` and add S3_BUCKET,
# S3_ACCESS_KEY_ID, S3_SECRET_ACCESS_KEY (and S3_ENDPOINT for Cloudflare R2)
# once an R2 bucket exists - the backend refuses to start with `s3` until
# those three are set.
#
# Fill the `sync: false` values in the Render dashboard when creating it.
services:
  - type: web
    name: propertyhub
    runtime: node
    plan: free
    buildCommand: >-
      cd frontend && npm ci --include=dev && npm run build &&
      cd ../backend && npm ci --include=dev && npm run build
    startCommand: cd backend && npm run start:render
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: NODE_ENV
        value: production
      - key: SWAGGER_ENABLED
        value: "false"
      - key: JWT_SECRET
        generateValue: true
      - key: CORS_ORIGINS
        sync: false
      - key: REGISTRATION_ENABLED
        value: "false"
      - key: DATABASE_URL
        sync: false
      - key: DB_SSL
        value: "true"
      - key: DB_SSL_REJECT_UNAUTHORIZED
        value: "true"
      - key: STORAGE_DRIVER
        value: local
      - key: ALLOW_LEGACY_LOGIN
        value: "false"
      - key: MASTER_ADMIN_EMAIL
        sync: false
      - key: MASTER_ADMIN_PASSWORD
        sync: false
